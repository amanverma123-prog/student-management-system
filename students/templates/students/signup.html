{% extends 'students/base.html' %} {% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card p-4">
      <div class="text-center mb-4">
        <i class="fas fa-user-plus fa-3x mb-3" style="color: #667eea"></i>
        <h3 class="page-title">Create Account</h3>
        <p class="text-muted">Sign up to get started</p>
      </div>
      <form method="POST">
        {% csrf_token %} {{ form.as_p }}
        <button type="submit" class="btn btn-primary w-100 mt-2 py-2">
          <i class="fas fa-user-plus me-1"></i>Register
        </button>
      </form>
      <div class="text-center mt-3">
        <a href="{% url 'login' %}" class="text-decoration-none"
          >Already have an account? <strong>Login</strong></a
        >
      </div>
    </div>
  </div>
</div>
{% endblock %}
