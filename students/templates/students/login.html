{% extends 'students/base.html' %} {% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card p-4">
      <div class="text-center mb-4">
        <i class="fas fa-graduation-cap fa-3x mb-3" style="color: #667eea"></i>
        <h3 class="page-title">Welcome Back</h3>
        <p class="text-muted">Sign in to your account</p>
      </div>
      <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-user"></i></span>
            <input
              type="text"
              name="username"
              class="form-control"
              placeholder="Enter username"
              required
            />
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input
              type="password"
              name="password"
              class="form-control"
              placeholder="Enter password"
              required
            />
          </div>
        </div>
        {% if form.errors %}
        <div class="alert alert-danger py-2">
          <i class="fas fa-exclamation-circle me-1"></i>Invalid username or
          password.
        </div>
        {% endif %}
        <button type="submit" class="btn btn-primary w-100 mt-2 py-2">
          <i class="fas fa-sign-in-alt me-1"></i>Login
        </button>
      </form>
      <div class="text-center mt-3">
        <a href="{% url 'signup' %}" class="text-decoration-none"
          >Don't have an account? <strong>Sign Up</strong></a
        >
      </div>
    </div>
  </div>
</div>
{% endblock %}
